<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ポモドーロタイマー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <canvas id="particleCanvas"></canvas>
  <div class="window">
    <div class="title-bar">
      <span class="title-text">ポモドーロタイマー</span>
      <div class="win-btns">
        <button class="settings-toggle" id="settingsToggle" title="設定">⚙</button>
        <span>－</span><span>□</span><span>×</span>
      </div>
    </div>

    <div class="content">
      <p class="phase-label" id="phaseLabel">作業中</p>
      <p class="cycle-counter" id="cycleCounter">1 / 4</p>

      <div class="ring-wrapper">
        <svg class="ring-svg" viewBox="0 0 160 160">
          <circle class="ring-bg" cx="80" cy="80" r="68" />
          <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="68" />
        </svg>
        <span class="time-display" id="timeDisplay">25:00</span>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">開始</button>
        <button class="btn btn-outline" onclick="resetTimer()">リセット</button>
      </div>

      <div class="progress-card">
        <p class="progress-title">今日の進捗</p>
        <div class="progress-row">
          <div class="progress-item">
            <span class="progress-value" id="sessionCount">0</span>
            <span class="progress-label">完了</span>
          </div>
          <div class="progress-item">
            <span class="progress-value accent" id="focusTime">0分</span>
            <span class="progress-label">集中時間</span>
          </div>
        </div>
      </div>

      <!-- XP / レベル / ストリーク -->
      <div class="xp-card">
        <div class="xp-header">
          <span class="level-badge" id="levelBadge">Lv.1</span>
          <span class="xp-text" id="xpText">0 / 100 XP</span>
          <span class="streak-badge" id="streakBadge">🔥 0日</span>
        </div>
        <div class="xp-bar-bg">
          <div class="xp-bar-fg" id="xpBarFg" style="width:0%"></div>
        </div>
      </div>

      <!-- バッジ -->
      <div class="badges-card">
        <p class="progress-title">バッジ</p>
        <div class="badges-grid" id="badgesGrid"></div>
      </div>

      <!-- 統計トグル -->
      <button class="btn btn-outline btn-full" id="statsToggleBtn" onclick="toggleStats()">📊 週間 / 月間統計</button>
      <div class="stats-section" id="statsSection" style="display:none">
        <div class="stats-tabs">
          <button class="stats-tab active" id="tabWeekly"  onclick="showStats(7)">週間（7日）</button>
          <button class="stats-tab"        id="tabMonthly" onclick="showStats(30)">月間（30日）</button>
        </div>
        <div id="chartContainer" class="chart-container"></div>
      </div>
    </div>

    <!-- 設定パネル -->
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-row">
        <span class="settings-label">作業時間</span>
        <div class="settings-options" id="workTimeOptions">
          <button class="opt-btn" data-value="15" onclick="setWorkMinutes(15)">15分</button>
          <button class="opt-btn active" data-value="25" onclick="setWorkMinutes(25)">25分</button>
          <button class="opt-btn" data-value="35" onclick="setWorkMinutes(35)">35分</button>
          <button class="opt-btn" data-value="45" onclick="setWorkMinutes(45)">45分</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">休憩時間</span>
        <div class="settings-options" id="breakTimeOptions">
          <button class="opt-btn active" data-value="5" onclick="setBreakMinutes(5)">5分</button>
          <button class="opt-btn" data-value="10" onclick="setBreakMinutes(10)">10分</button>
          <button class="opt-btn" data-value="15" onclick="setBreakMinutes(15)">15分</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">テーマ</span>
        <div class="settings-options" id="themeOptions">
          <button class="opt-btn active" data-value="light" onclick="setTheme('light')">ライト</button>
          <button class="opt-btn" data-value="dark" onclick="setTheme('dark')">ダーク</button>
          <button class="opt-btn" data-value="focus" onclick="setTheme('focus')">フォーカス</button>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">サウンド</span>
        <div class="settings-options">
          <button class="opt-btn active" id="soundStartBtn" onclick="toggleSound('start')">開始音</button>
          <button class="opt-btn active" id="soundEndBtn" onclick="toggleSound('end')">終了音</button>
          <button class="opt-btn" id="soundTickBtn" onclick="toggleSound('tick')">tick音</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/gamification.js') }}"></script>
</body>
</html>
